<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Astrafall – Leaderboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #d8d4f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background-color: #4A3F75;
      padding: 12px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .logo img { height: 48px; width: auto; }

    header nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    header nav a {
      color: #EBE6FE;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    header nav a:hover { opacity: 1; }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      gap: 24px;
    }

    /* CARD */
    .card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 36px 40px;
      width: 100%;
      max-width: 620px;
      color: white;
    }

    .card h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #c0b3e8;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead tr { border-bottom: 1px solid #444; }
    thead th { color: #aaa; font-weight: 500; padding: 8px 12px; text-align: left; }
    tbody tr { border-bottom: 1px solid #2a2a2a; transition: background-color 0.15s; }
    tbody tr:hover { background-color: #2a2a2a; }
    tbody td { padding: 10px 12px; color: #ddd; }

    .no-scores { color: #aaa; font-size: 0.9rem; text-align: center; padding: 20px 0; }

    .rank-1 { color: #FFD700; font-weight: 700; }
    .rank-2 { color: #C0C0C0; font-weight: 700; }
    .rank-3 { color: #CD7F32; font-weight: 700; }

    .you-row td { color: #c0b3e8; font-weight: 600; }

    .btn-back {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 32px;
      background-color: #6b5f99;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-back:hover { background-color: #7d70b0; }

    .loading { color: #555; text-align: center; margin-top: 60px; font-size: 1rem; }

    /* FOOTER */
    footer {
      background-color: #4A3F75;
      color: #EBE6FE;
      padding: 35px 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 1.1rem;
    }

    .footer-left p { margin: 0; }

    .footer-left a {
      color: #c0b3e8;
      text-decoration: underline;
    }

    .footer-left a:hover { color: white; }

    .footer-centre { display: flex; justify-content: center; }

    .footer-centre img.aston-logo { height: 70px; width: auto; }

    .footer-right {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      align-items: center;
    }

    .footer-right a img {
      height: 45px;
      width: 45px;
      transition: opacity 0.2s;
    }

    .footer-right a img:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <a href="https://astrafallgame.wixsite.com/astrafall">
        <img src="ASTRAFALL-logo.png" alt="Astrafall" />
      </a>
    </div>
    <nav>
      <a href="https://astrafallgame.wixsite.com/astrafall">Back to main site</a>
      <a id="nav-account-link" href="login.html">Log In</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main id="main-content">
    <p class="loading">Loading leaderboard...</p>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      <p>Contact us: <a href="mailto:astrafallgame@gmail.com">astrafallgame@gmail.com</a></p>
      <p>Any feedback? Submit using <a href="https://docs.google.com/forms/d/e/1FAIpQLSd8h1hhttJ3dvBng5Irh0YHAskvVpTKRvUtRrV3P8G84GuV3Q/viewform" target="_blank" rel="noreferrer noopener">this form</a>.</p>
      <p>Found a bug? Let us know <a href="https://docs.google.com/forms/d/e/1FAIpQLSchgQZC0gaWovY3oaZo8sIg5xZtDY2rq_kgzQsKEYsUwSQIsg/viewform" target="_blank" rel="noreferrer noopener">here</a>.</p>
    </div>
    <div class="footer-centre">
      <img class="aston-logo" src="https://static.wixstatic.com/media/f1983f_559f89c66b1640c389ad805709450309~mv2.png/v1/crop/x_0,y_204,w_768,h_364/fill/w_168,h_80,al_c,q_85,enc_auto/aston%20logo%20coloured.png" alt="Aston University" />
    </div>
    <div class="footer-right">
      <a href="https://www.instagram.com/astrafallgame/" target="_blank"><img src="Instagram.png" alt="Instagram" /></a>
      <a href="https://www.tiktok.com/@astrafallgame" target="_blank"><img src="TikTok.png" alt="TikTok" /></a>
      <a href="https://www.youtube.com/@AstrafallGame" target="_blank"><img src="YouTube.png" alt="YouTube" /></a>
    </div>
  </footer>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIUfRf7NvLOPt9-_r_hEE_knyqzoXXLBk",
      authDomain: "astrafall.firebaseapp.com",
      projectId: "astrafall",
      storageBucket: "astrafall.firebasestorage.app",
      messagingSenderId: "449361217572",
      appId: "1:449361217572:web:f65e481550e561234fb0b1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      const main = document.getElementById("main-content");

      // Update nav link
      const navLink = document.getElementById("nav-account-link");
      if (user) {
        navLink.textContent = "My Account";
        navLink.href = "account.html";
      }

      const scoresRef = collection(db, "scores");
      const leaderboardQuery = query(scoresRef, orderBy("score", "desc"), limit(10));
      const snapshot = await getDocs(leaderboardQuery);

      const leaderboard = [];
      snapshot.forEach(doc => leaderboard.push(doc.data()));

      const medalMap = { 1: "🥇", 2: "🥈", 3: "🥉" };
      const rankClass = { 1: "rank-1", 2: "rank-2", 3: "rank-3" };

      const rows = leaderboard.length > 0
        ? leaderboard.map((entry, i) => {
            const rank = i + 1;
            const isYou = user && entry.userId === user.uid;
            const medal = medalMap[rank] || rank;
            const cls = rankClass[rank] || "";
            return `
              <tr class="${isYou ? "you-row" : ""}">
                <td class="${cls}">${medal}</td>
                <td>${entry.username || "Player"}${isYou ? " <span style='color:#c0b3e8;font-size:0.75rem'>(you)</span>" : ""}</td>
                <td>${entry.score}</td>
              </tr>`;
          }).join("")
        : `<tr><td colspan="3" class="no-scores">No scores yet – be the first!</td></tr>`;

      main.innerHTML = `
        <div class="card">
          <h1>🏆 Global Leaderboard</h1>
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <a class="btn-back" href="${user ? "account.html" : "login.html"}">
            ${user ? "← Back to My Account" : "← Log In"}
          </a>
        </div>`;
    });
  </script>

</body>
</html>
