<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Astrafall – My Account</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #d8d4f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background-color: #4a3f6b;
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .logo img { height: 48px; width: auto; }

    header .social-icons { display: flex; gap: 12px; align-items: center; }

    header .social-icons a img {
      height: 50px;
      width: 50px;
      transition: opacity 0.2s;
    }

    header .social-icons a img:hover { opacity: 0.8; }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      gap: 24px;
    }

    /* CARDS */
    .card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 36px 40px;
      width: 100%;
      max-width: 620px;
      text-align: center;
      color: white;
    }

    .card h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .card .email { color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }

    /* STATS ROW */
    .stats { display: flex; justify-content: center; gap: 32px; margin-top: 8px; }

    .stat-box {
      background-color: #2a2a2a;
      border-radius: 8px;
      padding: 16px 28px;
      text-align: center;
    }

    .stat-box .stat-value { font-size: 1.8rem; font-weight: 700; color: #c0b3e8; }
    .stat-box .stat-label { font-size: 0.8rem; color: #aaa; margin-top: 4px; }

    /* TABLES */
    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #c0b3e8;
      text-align: left;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead tr { border-bottom: 1px solid #444; }
    thead th { color: #aaa; font-weight: 500; padding: 8px 12px; text-align: left; }
    tbody tr { border-bottom: 1px solid #2a2a2a; transition: background-color 0.15s; }
    tbody tr:hover { background-color: #2a2a2a; }
    tbody td { padding: 10px 12px; color: #ddd; }

    .no-scores { color: #aaa; font-size: 0.9rem; text-align: center; padding: 20px 0; }

    /* GOLD / SILVER / BRONZE */
    .rank-1 { color: #FFD700; font-weight: 700; }
    .rank-2 { color: #C0C0C0; font-weight: 700; }
    .rank-3 { color: #CD7F32; font-weight: 700; }

    /* HIGHLIGHT current player in leaderboard */
    .you-row td { color: #c0b3e8; font-weight: 600; }

    /* LOGOUT BUTTON */
    .btn-logout {
      margin-top: 24px;
      padding: 12px 32px;
      background-color: #6b5f99;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-logout:hover { background-color: #7d70b0; }

    /* NOT LOGGED IN */
    .not-logged-in { color: #333; text-align: center; margin-top: 40px; }
    .not-logged-in a { color: #4a3f6b; text-decoration: underline; }

    /* LOADING */
    .loading { color: #555; text-align: center; margin-top: 60px; font-size: 1rem; }

    /* FOOTER */
    footer {
      background-color: #221D3B;
      color: #EBE6FE;
      padding: 16px 20px;
      font-size: 1.35rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer a { color: #ccc; text-decoration: none; }
    footer a:hover { color: white; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <a href="https://astrafallgame.wixsite.com/astrafall">
        <img src="ASTRAFALL.png" alt="Astrafall" />
      </a>
    </div>
    <div class="social-icons">
      <a href="https://www.instagram.com/astrafallgame/" target="_blank">
        <img src="Instagram.png" alt="Instagram" />
      </a>
      <a href="https://www.tiktok.com/@astrafallgame" target="_blank">
        <img src="TikTok.png" alt="TikTok" />
      </a>
      <a href="https://www.youtube.com/@AstrafallGame" target="_blank">
        <img src="YouTube.png" alt="YouTube" />
      </a>
    </div>
  </header>

  <!-- MAIN -->
  <main id="main-content">
    <p class="loading">Loading your account...</p>
  </main>

  <!-- FOOTER -->
  <footer>
    <span>Aston University, Aston Street, Birmingham, B4 7ET</span>
    <span>Contact us: <a href="mailto:astrafallgame@gmail.com">astrafallgame@gmail.com</a></span>
  </footer>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIUfRf7NvLOPt9-_r_hEE_knyqzoXXLBk",
      authDomain: "astrafall.firebaseapp.com",
      projectId: "astrafall",
      storageBucket: "astrafall.firebasestorage.app",
      messagingSenderId: "449361217572",
      appId: "1:449361217572:web:f65e481550e561234fb0b1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      const main = document.getElementById("main-content");

      if (!user) {
        main.innerHTML = `
          <div class="not-logged-in">
            <p>You are not logged in.</p>
            <p style="margin-top:8px"><a href="login.html">Click here to log in</a></p>
          </div>`;
        return;
      }

      const scoresRef = collection(db, "scores");

      // Fetch player's own scores
      const myScoresQuery = query(
        scoresRef,
        where("userId", "==", user.uid),
        orderBy("score", "desc"),
        limit(10)
      );

      // Fetch global top 10
      const leaderboardQuery = query(
        scoresRef,
        orderBy("score", "desc"),
        limit(10)
      );

      const [mySnapshot, leaderboardSnapshot] = await Promise.all([
        getDocs(myScoresQuery),
        getDocs(leaderboardQuery)
      ]);

      const myScores = [];
      mySnapshot.forEach(doc => myScores.push(doc.data()));

      const leaderboard = [];
      leaderboardSnapshot.forEach(doc => leaderboard.push(doc.data()));

      // Personal best and global rank
      const personalBest = myScores.length > 0 ? myScores[0].score : "N/A";
      let globalRank = "N/A";
      leaderboard.forEach((entry, i) => {
        if (entry.userId === user.uid && globalRank === "N/A") {
          globalRank = i + 1;
        }
      });

      // My scores rows
      const scoreRows = myScores.length > 0
        ? myScores.map((s, i) => `
            <tr>
              <td>${i + 1}</td>
              <td>${s.score}</td>
              <td>${s.timestamp ? new Date(s.timestamp.seconds * 1000).toLocaleDateString() : "—"}</td>
            </tr>`).join("")
        : `<tr><td colspan="3" class="no-scores">No scores yet — go play!</td></tr>`;

      // Leaderboard rows
      const medalMap = { 1: "🥇", 2: "🥈", 3: "🥉" };
      const rankClass = { 1: "rank-1", 2: "rank-2", 3: "rank-3" };

      const leaderboardRows = leaderboard.length > 0
        ? leaderboard.map((entry, i) => {
            const rank = i + 1;
            const isYou = entry.userId === user.uid;
            const medal = medalMap[rank] || rank;
            const cls = rankClass[rank] || "";
            return `
              <tr class="${isYou ? "you-row" : ""}">
                <td class="${cls}">${medal}</td>
                <td>${entry.username || "Player"}${isYou ? " <span style='color:#c0b3e8;font-size:0.75rem'>(you)</span>" : ""}</td>
                <td>${entry.score}</td>
              </tr>`;
          }).join("")
        : `<tr><td colspan="3" class="no-scores">No scores yet — be the first!</td></tr>`;

      main.innerHTML = `
        <div class="card">
          <h1>👾 ${user.displayName || "Player"}</h1>
          <p class="email">${user.email}</p>
          <div class="stats">
            <div class="stat-box">
              <div class="stat-value">${personalBest}</div>
              <div class="stat-label">Personal Best</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${globalRank === "N/A" ? "—" : "#" + globalRank}</div>
              <div class="stat-label">Global Rank</div>
            </div>
          </div>
          <button class="btn-logout" onclick="handleLogout()">Log Out</button>
        </div>

        <div class="card">
          <h2>🏆 Global Leaderboard</h2>
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody>${leaderboardRows}</tbody>
          </table>
        </div>

        <div class="card">
          <h2>My Recent Scores</h2>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Score</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>${scoreRows}</tbody>
          </table>
        </div>`;
    });

    window.handleLogout = function () {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    };
  </script>

</body>
</html>
