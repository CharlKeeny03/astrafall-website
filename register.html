<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Astrafall – Create Account</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #d8d4f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background-color: #4a3f6b;
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .logo img {
      height: 48px;
      width: auto;
    }

    header .social-icons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    header .social-icons a img {
      height: 50px;
      width: 50px;
      transition: opacity 0.2s;
    }

    header .social-icons a img:hover {
      opacity: 0.8;
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .card h1 {
      color: white;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 32px;
    }

    .card input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      background-color: #1e1e1e;
      border: 1px solid #555;
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .card input::placeholder { color: #aaa; }
    .card input:focus { border-color: #7c6fa0; }

    .btn-register {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background-color: #6b5f99;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-register:hover { background-color: #7d70b0; }

    .card .login-link {
      color: white;
      font-size: 0.95rem;
      text-decoration: underline;
      display: block;
      margin-top: 16px;
      cursor: pointer;
    }

    .card .login-link:hover { color: #c0b3e8; }

    .card .tagline {
      color: #999;
      font-size: 0.85rem;
      margin-top: 20px;
    }

    .message {
      font-size: 0.88rem;
      margin-top: 12px;
      min-height: 20px;
    }

    .message.error { color: #ff6b6b; }
    .message.success { color: #6bffb8; }

    /* FOOTER */
    footer {
      background-color: #221D3B;
      color: #EBE6FE;
      padding: 16px 20px;
      font-size: 1.35rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer a {
      color: #ccc;
      text-decoration: none;
    }

    footer a:hover { color: white; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <a href="https://astrafallgame.wixsite.com/astrafall">
        <img src="ASTRAFALL.png" alt="Astrafall" />
      </a>
    </div>
    <div class="social-icons">
      <a href="https://www.instagram.com/astrafallgame/" target="_blank">
        <img src="Instagram.png" alt="Instagram" />
      </a>
      <a href="https://www.tiktok.com/@astrafallgame" target="_blank">
        <img src="TikTok.png" alt="TikTok" />
      </a>
      <a href="https://www.youtube.com/@AstrafallGame" target="_blank">
        <img src="YouTube.png" alt="YouTube" />
      </a>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="card">
      <h1>Create Account</h1>

      <input type="text" id="username" placeholder="Enter your username" />
      <input type="email" id="email" placeholder="Enter your email" />
      <input type="password" id="password" placeholder="Enter your password" />
      <input type="password" id="confirmPassword" placeholder="Confirm your password" />

      <button class="btn-register" onclick="handleRegister()">Create Account</button>

      <div class="message" id="message"></div>

      <a class="login-link" href="login.html">Already have an account? Log In</a>

      <p class="tagline">Join the puzzle-platformer revolution.</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <span>Aston University, Aston Street, Birmingham, B4 7ET</span>
    <span>Contact us: <a href="mailto:astrafallgame@gmail.com">astrafallgame@gmail.com</a></span>
  </footer>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIUfRf7NvLOPt9-_r_hEE_knyqzoXXLBk",
      authDomain: "astrafall.firebaseapp.com",
      projectId: "astrafall",
      storageBucket: "astrafall.firebasestorage.app",
      messagingSenderId: "449361217572",
      appId: "1:449361217572:web:f65e481550e561234fb0b1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleRegister = function () {
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      message.textContent = "";
      message.className = "message";

      // Validation
      if (!username || !email || !password || !confirmPassword) {
        message.textContent = "Please fill in all fields.";
        message.classList.add("error");
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.classList.add("error");
        return;
      }

      if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        message.classList.add("error");
        return;
      }

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // Save username to the Firebase profile
          return updateProfile(userCredential.user, { displayName: username });
        })
        .then(() => {
          message.textContent = "Account created! Redirecting...";
          message.classList.add("success");
          setTimeout(() => { window.location.href = "account.html"; }, 1000);
        })
        .catch((error) => {
          message.textContent = "Registration failed: " + error.message;
          message.classList.add("error");
        });
    };
  </script>

</body>
</html>
